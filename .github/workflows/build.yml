name: Build & Test CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Build & Test (.NET 9 & .NET 10)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - name: Restore Dependencies (.NET 10 / Jellyfin 12.0)
      run: dotnet restore plugin-jellytrack.sln

    - name: Run Unit Tests (.NET 10)
      run: dotnet test JellyTrack.Plugin.Tests/JellyTrack.Plugin.Tests.csproj --no-restore --configuration Release --verbosity normal

    - name: Build Plugin for Jellyfin 12.0 (.NET 10)
      run: dotnet build JellyTrack.Plugin/JellyTrack.Plugin.csproj --no-restore --configuration Release -warnaserror:CS0618

    - name: Build Plugin for Jellyfin 10.11 (.NET 9)
      run: dotnet build JellyTrack.Plugin/JellyTrack.Plugin.csproj -p:TargetFramework=net9.0 --configuration Release -warnaserror:CS0618 /restore
