name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-plugin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Version
        id: get_version
        run: |
          VERSION=$(jq -r '.version' meta.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish plugin
        run: dotnet publish JellyTrack.Plugin/JellyTrack.Plugin.csproj -c Release --no-restore -o publish

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: |
          pip install pyyaml
          python -m unittest discover -s scripts -p 'test_*.py'

      - name: Package Release & Calculate Checksum
        run: python scripts/package_release.py
        env:
          REPO: ${{ github.repository }}

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ env.VERSION }}"
          ARCHIVE="artifacts/Jellyfin.Plugin.JellyTrack-${{ env.VERSION }}.zip"
          echo "Target archive: ${ARCHIVE}"
          if gh release view "${TAG_NAME}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists. Uploading artifact..."
            gh release upload "${TAG_NAME}" "${ARCHIVE}" --clobber -R "${{ github.repository }}"
          else
            echo "Creating new release ${TAG_NAME}..."
            gh release create "${TAG_NAME}" "${ARCHIVE}" \
              --title "${TAG_NAME}" \
              --generate-notes \
              -R "${{ github.repository }}"
          fi

      - name: Update manifest.json in repository
        run: |
          cp artifacts/manifest.json ./manifest.json
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --staged --quiet; then
            echo "manifest.json is already up to date."
          else
            git commit -m "Update manifest.json for release v${{ env.VERSION }} [skip ci]"
            git push origin HEAD:main
          fi
