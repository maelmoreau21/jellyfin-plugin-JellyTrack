name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Get Version
      id: get_version
      run: |
        VERSION=$(jq -r '.version' meta.json)
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - name: Restore Dependencies
      run: dotnet restore plugin-jellytrack.sln

    - name: Run Automated Tests
      run: dotnet test JellyTrack.Plugin.Tests/JellyTrack.Plugin.Tests.csproj --no-restore --configuration Release --verbosity normal

    - name: Build and Publish (.NET 10 / Jellyfin 12)
      run: dotnet publish JellyTrack.Plugin/JellyTrack.Plugin.csproj -c Release -p:TargetFramework=net10.0 -o ./publish-net10

    - name: Build and Publish (.NET 9 / Jellyfin 10.11)
      run: dotnet publish JellyTrack.Plugin/JellyTrack.Plugin.csproj -c Release -p:TargetFramework=net9.0 -o ./publish-net9 /restore

    - name: Create Zip Archives
      run: |
        # 1. Jellyfin 12 package (.NET 10)
        cp meta.json ./publish-net10/meta.json
        cp assets/banner.png ./publish-net10/Jellyfin.Plugin.JellyTrack.png
        cd ./publish-net10
        zip -r ../Jellyfin.Plugin.JellyTrack-${{ env.VERSION }}.zip meta.json Jellyfin.Plugin.JellyTrack.deps.json Jellyfin.Plugin.JellyTrack.dll Jellyfin.Plugin.JellyTrack.pdb Jellyfin.Plugin.JellyTrack.png
        cd ..

        # 2. Jellyfin 10.11 package (.NET 9)
        jq '.targetAbi = "10.11.0.0"' meta.json > ./publish-net9/meta.json
        cp assets/banner.png ./publish-net9/Jellyfin.Plugin.JellyTrack.png
        cd ./publish-net9
        zip -r ../Jellyfin.Plugin.JellyTrack-${{ env.VERSION }}-jellyfin11.zip meta.json Jellyfin.Plugin.JellyTrack.deps.json Jellyfin.Plugin.JellyTrack.dll Jellyfin.Plugin.JellyTrack.pdb Jellyfin.Plugin.JellyTrack.png
        cd ..

    - name: Create or Update GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ env.VERSION }}
        files: |
          Jellyfin.Plugin.JellyTrack-${{ env.VERSION }}.zip
          Jellyfin.Plugin.JellyTrack-${{ env.VERSION }}-jellyfin11.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Python Dependencies
      run: pip install pyyaml

    - name: Update manifest.json
      run: python scripts/update_manifest.py
      env:
        RELEASE_TAG: v${{ env.VERSION }}
        REPO: ${{ github.repository }}

    - name: Commit and Push manifest.json
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add manifest.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Update manifest.json for release v${{ env.VERSION }}"
        git push origin HEAD:main
