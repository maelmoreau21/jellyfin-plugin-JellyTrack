name: Prepare release archive (no publication)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build
      - run: dotnet publish JellyTrack.Plugin/JellyTrack.Plugin.csproj -c Release --no-restore -o publish
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pyyaml
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Package and prepare manifest
        run: python scripts/package_release.py
        env:
          REPO: ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with:
          name: jellytrack-jellyfin12-release-candidate
          path: |
            artifacts/*.zip
            artifacts/manifest.json
