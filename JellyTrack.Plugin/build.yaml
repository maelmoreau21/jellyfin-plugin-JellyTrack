name: "JellyTrack"
guid: "e5a2f2ed-7c2a-4a9f-b1d3-5e6f7a8b9c0d"
version: "2.2.0.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
owner: "JellyTrack"
overview: "Jellyfin plugin to push playback events to JellyTrack"
description: >
  JellyTrack is an analytics dashboard for Jellyfin.
  This plugin intercepts playback events (start, stop, progress),
  library changes and sends a periodic heartbeat
  to the JellyTrack server.
category: "General"
artifacts:
  - "Jellyfin.Plugin.JellyTrack.dll"
changelog: |
  ## v2.2.0.0
  - Support Jellyfin 12.4 with targetAbi 12.4.0.0 and .NET 10.
  - Direct ISessionManager event listener integration to reliably capture PlaybackStart, PlaybackProgress, PlaybackStopped, and SessionEnded events.
  - Robust user resolution fallback supporting e.Users and session.AdditionalUsers when session.UserId is empty.
  - Updated Jellyfin.Controller and Jellyfin.Model packages to 12.4.0.
